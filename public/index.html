<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Scout</title>
    <meta
      name="description"
      content="Location-aware photography and outdoor activity recommendations, grounded in live conditions."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f4f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Scout" />
    <link rel="manifest" href="manifest.json" />
    <link
      rel="preload"
      href="fonts/dm-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Scout sessions">
        <div class="sidebar__top">
          <div class="sidebar__brand">
            <img src="logo.svg" alt="" width="20" height="20" />
            <span>Scout</span>
          </div>
          <button
            class="icon-button mobile-close"
            id="nav-close"
            type="button"
            aria-label="Close sessions"
          >
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" /></svg>
          </button>
        </div>
        <button class="button button--primary sidebar__new" id="new-session" type="button">
          New scout
        </button>
        <input
          class="input sidebar__search"
          id="session-search"
          type="search"
          placeholder="Search scouts"
          aria-label="Search scouts"
          autocomplete="off"
        />
        <div class="sidebar__sessions" id="session-list"></div>
        <button
          class="sidebar__settings"
          id="settings-open"
          type="button"
          aria-label="Open settings"
        >
          Settings
        </button>
      </aside>

      <main class="main">
        <header class="topbar">
          <button
            class="icon-button hamburger"
            id="sidebar-toggle"
            type="button"
            aria-label="Open sessions"
            aria-controls="mobile-nav"
            aria-expanded="false"
          >
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M2 4.5h14M2 9h14M2 13.5h14" /></svg>
          </button>
          <div class="topbar__title" id="active-session-title">New scout</div>
          <nav class="steps" id="steps" aria-label="Steps"></nav>
        </header>
        <section class="content" id="main-content" tabindex="-1"></section>
      </main>
    </div>

    <dialog id="mobile-nav" aria-label="Scout sessions"></dialog>
    <div class="settings-overlay" id="settings-overlay"></div>
    <dialog
      class="settings-panel"
      id="settings-panel"
      aria-label="Settings"
      aria-hidden="true"
    ></dialog>

    <script type="module" src="/assets/main.js"></script>
  </body>
</html>
